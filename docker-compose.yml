version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: foundation-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundation}
      POSTGRES_USER: ${POSTGRES_USER:-foundation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foundation-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: foundation-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foundation-network

  # MinIO S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: foundation-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - foundation-network

  # Initialize MinIO bucket
  minio-init:
    image: minio/mc:latest
    container_name: foundation-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${S3_BUCKET:-foundation-dev} || true;
      mc anonymous set public local/${S3_BUCKET:-foundation-dev};
      exit 0;
      "
    networks:
      - foundation-network

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: foundation-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - foundation-network

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: foundation-web
    command: >
      sh -c "
      cd foundation &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app:cached
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-foundation}:${POSTGRES_PASSWORD:-foundation}@db:5432/${POSTGRES_DB:-foundation}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - AWS_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - foundation-network

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: foundation-worker
    command: sh -c "cd foundation && celery -A foundation.config worker -l info"
    volumes:
      - .:/app:cached
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-foundation}:${POSTGRES_PASSWORD:-foundation}@db:5432/${POSTGRES_DB:-foundation}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - AWS_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - foundation-network

  # Celery Beat Scheduler
  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: foundation-beat
    command: sh -c "cd foundation && celery -A foundation.config beat -l info"
    volumes:
      - .:/app:cached
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-foundation}:${POSTGRES_PASSWORD:-foundation}@db:5432/${POSTGRES_DB:-foundation}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - foundation-network

  # Flower - Celery Monitoring
  flower:
    image: mher/flower:2.0
    container_name: foundation-flower
    command: flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      - redis
    networks:
      - foundation-network

networks:
  foundation-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: