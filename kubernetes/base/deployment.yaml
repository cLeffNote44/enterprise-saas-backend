apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-saas-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enterprise-saas
      component: web
  template:
    metadata:
      labels:
        app: enterprise-saas
        component: web
    spec:
      containers:
      - name: web
        image: enterprise-saas:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: enterprise-saas-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: enterprise-saas-secrets
              key: redis-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
